<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="robots" content="noindex, nofollow">
  <title>ARVEXA Admin · Connexion</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="register-sw.js" defer></script>

  <style>
    :root {
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --success: #2D7D5A;
      --success-light: #3AB67E;
      --danger: #E74C3C;
      --danger-light: #f87171;
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --border-soft: rgba(255, 255, 255, 0.06);
      --card-border: rgba(184, 134, 11, 0.15);
      --input-bg: rgba(255, 255, 255, 0.03);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }

    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
      background:
        radial-gradient(ellipse 60% 40% at 30% 20%, rgba(26, 58, 42, 0.25) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 75% 80%, rgba(184, 134, 11, 0.08) 0%, transparent 60%),
        linear-gradient(180deg, #0A0A0A 0%, #050505 100%);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .wrap {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 18px;
      box-shadow: 0 8px 32px rgba(184, 134, 11, 0.3);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    h1 em { color: var(--accent-bright); font-style: italic; }

    .sub {
      color: var(--text-dim);
      font-size: 13px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .card {
      padding: 24px 20px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.2px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      transition: all 0.2s ease;
      overflow: hidden;
    }
    .input-wrap:focus-within {
      border-color: rgba(184, 134, 11, 0.4);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.08);
    }
    .input-wrap.is-error {
      border-color: rgba(231, 76, 60, 0.4);
    }

    .input-wrap > i {
      padding: 0 4px 0 14px;
      color: var(--text-muted);
      font-size: 14px;
      flex-shrink: 0;
    }
    .input-wrap:focus-within > i { color: var(--accent-bright); }

    .input-wrap input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px 12px 10px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-light);
      font-size: 14px;
      font-family: inherit;
    }
    .input-wrap input::placeholder { color: var(--text-muted); }
    .input-wrap input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px #141414 inset !important;
      -webkit-text-fill-color: var(--text-light) !important;
    }

    .toggle-pwd {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-right: 4px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .toggle-pwd:hover { color: var(--accent-bright); background: rgba(184, 134, 11, 0.06); }

    .error-msg {
      display: none;
      padding: 10px 14px;
      border-radius: 9px;
      background: rgba(231, 76, 60, 0.08);
      border: 1px solid rgba(231, 76, 60, 0.2);
      color: var(--danger-light);
      font-size: 12.5px;
      line-height: 1.5;
      align-items: flex-start;
      gap: 8px;
    }
    .error-msg.show { display: flex; }
    .error-msg i { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      min-height: 48px;
      width: 100%;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      box-shadow: 0 4px 20px rgba(184, 134, 11, 0.2);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(184, 134, 11, 0.35);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-dim);
      border: 1px solid var(--border-soft);
    }
    .btn-secondary:hover { color: var(--text-light); border-color: rgba(255, 255, 255, 0.12); }

    .btn .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(10, 10, 10, 0.2);
      border-top-color: #0A0A0A;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn.loading .spinner { display: block; }
    .btn.loading .btn-text { display: none; }
    .btn.loading .btn-icon { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 12.5px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .back-link:hover { color: var(--accent-bright); }

    .denied {
      display: none;
      padding: 24px 20px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(231, 76, 60, 0.2);
      border-radius: 16px;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .denied.show { display: flex; }
    .denied-icon { font-size: 40px; }
    .denied-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--danger-light);
    }
    .denied-text {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 480px) {
      .logo { width: 60px; height: 60px; font-size: 24px; }
      h1 { font-size: 22px; }
      .card { padding: 20px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="logo">A</div>
    <h1>ARVEXA <em>Admin</em></h1>
    <p class="sub">Connecte-toi avec ton compte administrateur</p>

    <!-- FORMULAIRE -->
    <div class="card" id="loginCard">
      <form id="loginForm" novalidate>

        <div class="field">
          <label for="emailInput">Email</label>
          <div class="input-wrap" id="emailWrap">
            <i class="fas fa-envelope"></i>
            <input
              type="email"
              id="emailInput"
              placeholder="admin@exemple.com"
              autocomplete="email"
              inputmode="email"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="passwordInput">Mot de passe</label>
          <div class="input-wrap" id="passwordWrap">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              id="passwordInput"
              placeholder="Ton mot de passe"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="toggle-pwd"
              id="togglePassword"
              aria-label="Afficher le mot de passe"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="error-msg" id="errorMsg">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorText">Erreur</span>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span class="btn-icon"><i class="fas fa-sign-in-alt"></i></span>
          <span class="btn-text">Se connecter</span>
          <span class="spinner"></span>
        </button>

      </form>
    </div>

    <!-- ACCÈS REFUSÉ -->
    <div class="denied" id="deniedCard">
      <div class="denied-icon">🚫</div>
      <div class="denied-title">Accès refusé</div>
      <p class="denied-text" id="deniedText">
        Ce compte n'est pas administrateur.
      </p>
      <button type="button" class="btn btn-secondary" id="deniedLogoutBtn">
        <i class="fas fa-sign-out-alt"></i> Utiliser un autre compte
      </button>
    </div>

    <a href="https://arvexaschool.vercel.app" class="back-link">
      <i class="fas fa-arrow-left"></i> Retour au site
    </a>
  </div>

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
  </script>

  <script type="module">
  // ================================================================
  // ADMIN LOGIN — Connexion directe sur admin-89.vercel.app
  // ================================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import {
    getAuth,
    setPersistence,
    browserLocalPersistence,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  // ═══════════════════════════════════════════════════════════════
  // CONFIG
  // ═══════════════════════════════════════════════════════════════
  const ADMIN_EMAILS = ['gagneavecia@gmail.com'];

  const firebaseConfig = {
    apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
    authDomain: "arvexa-fbf10.firebaseapp.com",
    projectId: "arvexa-fbf10",
    storageBucket: "arvexa-fbf10.firebasestorage.app",
    messagingSenderId: "920108330053",
    appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  try {
    await setPersistence(auth, browserLocalPersistence);
  } catch (e) {}

  // ═══════════════════════════════════════════════════════════════
  // DOM
  // ═══════════════════════════════════════════════════════════════
  const $ = (id) => document.getElementById(id);

  const loginCard = $('loginCard');
  const deniedCard = $('deniedCard');
  const deniedText = $('deniedText');
  const loginForm = $('loginForm');
  const emailInput = $('emailInput');
  const passwordInput = $('passwordInput');
  const emailWrap = $('emailWrap');
  const passwordWrap = $('passwordWrap');
  const togglePassword = $('togglePassword');
  const loginBtn = $('loginBtn');
  const errorMsg = $('errorMsg');
  const errorText = $('errorText');
  const deniedLogoutBtn = $('deniedLogoutBtn');

  // ═══════════════════════════════════════════════════════════════
  // UI HELPERS
  // ═══════════════════════════════════════════════════════════════
  function showError(message) {
    errorText.textContent = message;
    errorMsg.classList.add('show');
  }

  function hideError() {
    errorMsg.classList.remove('show');
    emailWrap.classList.remove('is-error');
    passwordWrap.classList.remove('is-error');
  }

  function setLoading(loading) {
    loginBtn.disabled = loading;
    loginBtn.classList.toggle('loading', loading);
  }

  function showDenied(message) {
    loginCard.style.display = 'none';
    deniedCard.classList.add('show');
    if (message) deniedText.textContent = message;
  }

  function showLogin() {
    deniedCard.classList.remove('show');
    loginCard.style.display = 'block';
    hideError();
    setLoading(false);
  }

  // ═══════════════════════════════════════════════════════════════
  // VERIFICATION ADMIN
  // ═══════════════════════════════════════════════════════════════
  async function checkIsAdmin(user) {
    if (!user) return false;

    // 1) Email en dur
    if (ADMIN_EMAILS.includes(user.email)) return true;

    // 2) Rôle Firestore
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists() && snap.data().role === 'admin') return true;
    } catch (e) {
      console.warn('Erreur check admin Firestore:', e.message);
    }

    return false;
  }

  // ═══════════════════════════════════════════════════════════════
  // REDIRECTION
  // ═══════════════════════════════════════════════════════════════
  function redirectToConsole() {
    window.location.replace('admin.html');
  }

  // ═══════════════════════════════════════════════════════════════
  // TOGGLE MOT DE PASSE
  // ═══════════════════════════════════════════════════════════════
  togglePassword.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    togglePassword.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
    togglePassword.setAttribute('aria-label', isPassword ? 'Masquer' : 'Afficher');
  });

  // ═══════════════════════════════════════════════════════════════
  // SOUMISSION DU FORMULAIRE
  // ═══════════════════════════════════════════════════════════════
  let isSubmitting = false;

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (isSubmitting) return;

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    hideError();

    // Validation basique
    if (!email) {
      emailWrap.classList.add('is-error');
      showError('Entre ton adresse email');
      emailInput.focus();
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailWrap.classList.add('is-error');
      showError('Format d\'email invalide');
      emailInput.focus();
      return;
    }

    if (!password) {
      passwordWrap.classList.add('is-error');
      showError('Entre ton mot de passe');
      passwordInput.focus();
      return;
    }

    if (password.length < 6) {
      passwordWrap.classList.add('is-error');
      showError('Le mot de passe est trop court');
      passwordInput.focus();
      return;
    }

    isSubmitting = true;
    setLoading(true);

    try {
      const credential = await signInWithEmailAndPassword(auth, email, password);
      const user = credential.user;

      // Vérifier le rôle admin
      const isAdmin = await checkIsAdmin(user);

      if (!isAdmin) {
        try { await signOut(auth); } catch (_) {}
        showDenied(`Le compte « ${email} » n'est pas administrateur.`);
        isSubmitting = false;
        setLoading(false);
        return;
      }

      // ✅ Admin confirmé → redirection
      redirectToConsole();

    } catch (error) {
      console.error('Erreur login:', error);

      let message = 'Une erreur est survenue. Réessaie.';

      switch (error.code) {
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential':
          message = 'Email ou mot de passe incorrect.';
          break;
        case 'auth/invalid-email':
          message = 'Adresse email invalide.';
          break;
        case 'auth/too-many-requests':
          message = 'Trop de tentatives. Réessaie dans quelques minutes.';
          break;
        case 'auth/network-request-failed':
          message = 'Problème de connexion internet.';
          break;
        case 'auth/user-disabled':
          message = 'Ce compte a été désactivé.';
          break;
        default:
          message = error.message || message;
      }

      showError(message);
      setLoading(false);
      isSubmitting = false;
    }
  });

  // ═══════════════════════════════════════════════════════════════
  // DÉCONNEXION DEPUIS L'ÉCRAN "REFUSÉ"
  // ═══════════════════════════════════════════════════════════════
  deniedLogoutBtn.addEventListener('click', async () => {
    try { await signOut(auth); } catch (e) {}
    emailInput.value = '';
    passwordInput.value = '';
    isSubmitting = false;
    showLogin();
    setTimeout(() => emailInput.focus(), 100);
  });

  // ═══════════════════════════════════════════════════════════════
  // SI DÉJÀ CONNECTÉ EN TANT QU'ADMIN → REDIRECT IMMÉDIAT
  // ═══════════════════════════════════════════════════════════════
  onAuthStateChanged(auth, async (user) => {
    if (!user) return; // Pas connecté → formulaire visible par défaut

    // Utilisateur déjà restauré → vérifier admin
    const isAdmin = await checkIsAdmin(user);

    if (isAdmin) {
      redirectToConsole();
    } else {
      // Connecté mais pas admin : déconnexion silencieuse + formulaire
      try { await signOut(auth); } catch (e) {}
      // Le formulaire est déjà affiché par défaut
    }
  });

  console.log('🔐 ARVEXA Admin — Login direct');
  </script>
</body>
</html>
