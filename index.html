<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="robots" content="noindex, nofollow">
  <title>ARVEXA Admin · Connexion</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-admin-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-admin-192.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="register-sw.js" defer></script>

  <style>
    :root {
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --success: #2D7D5A;
      --success-light: #3AB67E;
      --danger: #E74C3C;
      --danger-light: #f87171;
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --border-soft: rgba(255, 255, 255, 0.06);
      --card-border: rgba(184, 134, 11, 0.15);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }

    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
      background: #0A0A0A;
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
      background:
        radial-gradient(ellipse 60% 40% at 30% 20%, rgba(26, 58, 42, 0.25) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 75% 80%, rgba(184, 134, 11, 0.08) 0%, transparent 60%),
        linear-gradient(180deg, #0A0A0A 0%, #050505 100%);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .wrap {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 18px;
      box-shadow: 0 8px 32px rgba(184, 134, 11, 0.3);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    h1 em { color: var(--accent-bright); font-style: italic; }

    .sub {
      color: var(--text-dim);
      font-size: 13px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .status {
      padding: 20px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(184, 134, 11, 0.15);
      border-top-color: var(--accent-bright);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status p {
      font-size: 13px;
      color: var(--text-dim);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      min-height: 46px;
      margin-top: 4px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      box-shadow: 0 4px 20px rgba(184, 134, 11, 0.2);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(184, 134, 11, 0.35);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-dim);
      border: 1px solid var(--border-soft);
    }
    .btn-secondary:hover {
      color: var(--text-light);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .error-box {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(231, 76, 60, 0.08);
      border: 1px solid rgba(231, 76, 60, 0.2);
      color: var(--danger-light);
      font-size: 12.5px;
      line-height: 1.5;
      text-align: left;
      width: 100%;
    }
    .error-box.show { display: flex; align-items: flex-start; gap: 8px; }
    .error-box i { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

    .actions-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="logo">A</div>
    <h1>ARVEXA <em>Admin</em></h1>
    <p class="sub">Vérification de la session en cours...</p>

    <div class="status" id="statusBox">
      <div class="spinner"></div>
      <p id="statusText">Chargement...</p>
    </div>

    <div class="error-box" id="errorBox">
      <i class="fas fa-exclamation-circle"></i>
      <span id="errorText"></span>
    </div>

    <div class="actions-row" id="actionsRow" style="display:none">
      <a href="admin.html" class="btn btn-primary">
        <i class="fas fa-shield-halved"></i> Accéder à la console
      </a>
      <button type="button" class="btn btn-secondary" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Utiliser un autre compte
      </button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
  </script>

  <script type="module">
  // ================================================================
  // LOGIN ADMIN — Vérifie Firebase puis redirige
  // ================================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

  const ADMIN_EMAILS = ['gagneavecia@gmail.com'];

  const app = initializeApp({
    apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
    authDomain: "arvexa-fbf10.firebaseapp.com",
    projectId: "arvexa-fbf10",
    storageBucket: "arvexa-fbf10.firebasestorage.app",
    messagingSenderId: "920108330053",
    appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
  });

  const auth = getAuth(app);
  const db = getFirestore(app);

  try {
    await setPersistence(auth, browserLocalPersistence);
  } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const statusText = $('statusText');
  const statusBox = $('statusBox');
  const errorBox = $('errorBox');
  const errorText = $('errorText');
  const actionsRow = $('actionsRow');
  const logoutBtn = $('logoutBtn');

  function showError(msg) {
    statusBox.style.display = 'none';
    errorText.textContent = msg;
    errorBox.classList.add('show');
  }

  function showSuccess() {
    statusBox.style.display = 'none';
    errorBox.classList.remove('show');
    actionsRow.style.display = 'flex';
  }

  // Vérifier après 5 secondes max
  const timeout = setTimeout(() => {
    showError('Délai de connexion dépassé. Vérifie ta connexion internet.');
  }, 5000);

  onAuthStateChanged(auth, async (user) => {
    clearTimeout(timeout);

    if (!user) {
      statusText.textContent = 'Aucune session trouvée.';
      showError('Tu n\'es pas connecté. Va sur le site principal pour te connecter, puis reviens ici.');
      return;
    }

    // Vérifier si admin
    statusText.textContent = 'Vérification des autorisations...';

    let isAdmin = ADMIN_EMAILS.includes(user.email);

    if (!isAdmin) {
      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        if (snap.exists() && snap.data().role === 'admin') {
          isAdmin = true;
        }
      } catch (e) {}
    }

    if (!isAdmin) {
      showError('Accès refusé. Ce compte n\'est pas administrateur.');
      return;
    }

    // ✅ Tout est bon
    statusText.textContent = 'Connecté en tant qu\'admin';
    showSuccess();
  });

  logoutBtn.addEventListener('click', async () => {
    if (!confirm('Se déconnecter ?')) return;
    try { await signOut(auth); } catch (e) {}
    // Rediriger vers le site principal ou recharger
    window.location.reload();
  });

  console.log('🔐 ARVEXA Admin — Login');
  </script>
</body>
</html>
